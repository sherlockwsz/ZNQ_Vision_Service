# TwinCAT + Python Vision Service production configuration

[service]
ads_poll_interval_ms = 20
log_level = "INFO"
log_dir = "logs"

[ads]
# Leave empty when VisionService.exe runs on the same Windows/TwinCAT host and
# pyads can resolve the local AMS Net ID. For a remote PLC, set the target AMS
# Net ID explicitly (example format: 192.168.1.10.1.1).
ams_net_id = "172.18.238.251.1.1"
ams_port = 851
# Optional PLC IP for a remote ADS route. Empty for local runtime.
ip_address = ""

[screw_input]
# "camera" for production or "file" for PLC/ADS/algorithm commissioning.
mode = "file"
# Relative paths are resolved from the directory containing config.toml.
# The file is decoded again for every new PLC Screw RequestId.
image_path = "test_images/screw_test.bmp"

[coax_input]
# Screw and Coax input modes are independent.
mode = "file"
# The file is decoded again for every new PLC Coax RequestId.
image_path = "test_images/coax_test.bmp"

[screw_camera]
model_name = "ME2P-1230-9GM-P"
# Production recommendation: fill the physical camera SN after first discovery.
# When empty, exact model_name matching is used; startup fails if ambiguous.
serial = ""
# 0 / -1 means preserve the camera's configured value in Galaxy Viewer/UserSet.
exposure_us = 0.0
gain_db = -1.0
timeout_ms = 3000

[coax_camera]
model_name = "MARS-2621-42GTM"
serial = ""
exposure_us = 0.0
gain_db = -1.0
timeout_ms = 3000

[screw_algorithm]
model_path = "best.pt"
# TEMPORARY COMMISSIONING PLACEHOLDER. Replace with the calibrated Screw Camera
# scale before validating production parts; it is independent of Coax Camera.
mm_per_pixel = 0.1
min_screw_distance_mm = 24.0
max_screw_distance_mm = 26.0

[screw_mapping]
# Mapping from the measured undirected Screw line angle to the DamperRotation
# correction command. Confirm sign and zero offset by low-speed mechanical test.
correction_sign = 1.0
correction_offset_deg = 0.0

[coax_algorithm]
procedure_path = "detect_coax.hdvp"
# Phase 1 calibration source of truth. Negative reference coordinates mean:
# TEMPORARY COMMISSIONING DEFAULT = use (image_size - 1) / 2 for that axis.
# Before production, replace both with standard-part calibrated pixel values.
reference_x_px = -1.0
reference_y_px = -1.0
# TEMPORARY COMMISSIONING VALUE. Replace with the calibrated scale.
mm_per_pixel = 0.0025

[coax_mapping]
# Reserved compatibility fields for a later Camera -> Machine calibration phase.
# Coax Phase 1 deliberately does not apply them: +DeltaX is image-right and
# +DeltaY is image-down, and Python never commands Adjustment axes.
delta_x_sign = 1.0
delta_y_sign = 1.0

[tcp_image]
host = "0.0.0.0"
port = 50010
jpeg_quality = 85
